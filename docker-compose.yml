services:
  flood-simulation:
    build: .
    container_name: flood-simulation
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - RELOAD=false
    # Gives the container access to all 4 host CPU cores without throttling
    deploy:
      resources:
        reservations:
          cpus: '1.0'
          memory: 1G

  # ── OPTIONAL: Cloudflare Tunnel Container ─────────────────────────────────
  # If you want to run Cloudflare Tunnel directly in Docker with your domain,
  # create a .env file with TUNNEL_TOKEN=<your_token> and uncomment this block:
  #
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
  #   depends_on:
  #     - flood-simulation
